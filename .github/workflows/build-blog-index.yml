
name: Build Content Indexes and Sitemap

on:
  push:
    branches:
      - main
    paths:
      - "content/blogs/**"
      - "content/updates/**"
      - "content/media/**"
      - "scripts/build-blog-index.mjs"
      - ".github/workflows/build-blog-index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-indexes:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate content indexes and sitemap
        run: node scripts/build-blog-index.mjs

      - name: Commit updated indexes and sitemap
        run: |
          git add -f content/blog-index.json
          git add -f content/updates-index.json
          git add -f content/media-index.json
          git add -f sitemap.xml

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update content indexes and sitemap"
          git push
          
