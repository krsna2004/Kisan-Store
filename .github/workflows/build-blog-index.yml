
name: Build Content Indexes, Product Pages and Sitemap

on:
  push:
    branches:
      - main
    paths:
      - "content/blogs/**"
      - "content/updates/**"
      - "content/media/**"
      - "content/products.json"
      - "products.html"
      - "scripts/build-blog-index.mjs"
      - "scripts/build-product-pages.mjs"
      - ".github/workflows/build-blog-index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-content:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate blog, update and media indexes
        run: node scripts/build-blog-index.mjs

      - name: Generate product pages and update sitemap
        run: node scripts/build-product-pages.mjs

      - name: Commit generated files
        run: |
          git add -f content/blog-index.json
          git add -f content/updates-index.json
          git add -f content/media-index.json
          git add -f sitemap.xml
          git add -f products/

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build content indexes and product pages"
          git push
          
