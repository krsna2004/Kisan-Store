name: Build Blog Index

on:
  push:
    branches:
      - main
    paths:
      - "content/blogs/**"
      - "scripts/build-blog-index.mjs"
      - ".github/workflows/build-blog-index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate blog index
        run: node scripts/build-blog-index.mjs

      
      - name: Commit updated blog index
        run: |
          git add -f content/blog-index.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update generated blog index"
          git push
          
