media:
  - name: store_media
    label: Store Images
    input: assets/images
    output: assets/images

content:
  - name: products
    label: Products
    type: file
    path: content/products.json
    format: json
    list: true
    fields:
      - name: name
        label: Product Name
        type: string
        required: true
      - name: category
        label: Category
        type: string
      - name: price
        label: Price (₹)
        type: number
      - name: stock
        label: Stock Quantity
        type: number
      - name: available
        label: Available for Sale
        type: boolean
      - name: image
        label: Product Image Path
        type: string
      - name: description
        label: Description
        type: text
      - name: name_hi
        label: Product Name (Hindi)
        type: string
      - name: category_hi
        label: Category (Hindi)
        type: string
      - name: description_hi
        label: Description (Hindi)
        type: text


  - name: blogs
    label: Blog Posts
    type: collection
    path: content/blogs
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      fields: [title, date, category, status, featured]
      sort: [date, title]
      order: desc
    fields:
      - name: title
        label: Blog Title
        type: string
        required: true

      - name: slug
        label: URL Slug
        type: string
        required: true
        description: "Lowercase words separated by hyphens, e.g. choose-right-water-pipes"
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"

      - name: description
        label: Short Description
        type: text
        required: true

      - name: date
        label: Publication Date
        type: date
        required: true

      - name: author
        label: Author
        type: string

      - name: category
        label: Category
        type: select
        options:
          values:
            - Buying Guides
            - Plumbing
            - Sanitaryware
            - Hardware
            - Home Improvement
            - Store News

      - name: tags
        label: Tags
        type: string

      - name: image
        label: Cover Image
        type: image
        options:
          media: store_media
          path: blog

      - name: image_alt
        label: Cover Image Alt Text
        type: string
        description: Describe the image for accessibility and image search.

      - name: content
        label: Article Content
        type: rich-text
        options:
          media: store_media
          path: blog
          format: markdown

      - name: seo_title
        label: SEO Title
        type: string

      - name: meta_description
        label: Meta Description
        type: text

      - name: featured
        label: Featured Article
        type: boolean

      - name: status
        label: Publication Status
        type: select
        required: true
        options:
          values:
            - Draft
            - Published

      - name: title_hi
        label: Blog Title (Hindi)
        type: string

      - name: description_hi
        label: Short Description (Hindi)
        type: text

      - name: content_hi
        label: Article Content (Hindi)
        type: rich-text
        options:
          media: store_media
          path: blog
          format: markdown
          
  
  - name: updates
    label: News & Updates
    type: collection
    path: content/updates
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      fields: [date, category, featured, status]
      sort: [date, title]
      order: desc
    fields:
      - name: title
        label: Update Title
        type: string
        required: true

      - name: slug
        label: URL Slug
        type: string
        required: true
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"

      - name: message
        label: Update Message
        type: text
        required: true

      - name: date
        label: Publication Date
        type: date
        required: true

      - name: category
        label: Category
        type: select
        options:
          values:
            - Store Announcement
            - New Arrivals
            - Store Timings
            - Offers
            - General

      - name: featured
        label: Feature This Update
        type: boolean

      - name: expiry_date
        label: Expiry Date (Optional)
        type: date

      - name: status
        label: Publication Status
        type: select
        required: true
        options:
          values:
            - Draft
            - Published

      - name: title_hi
        label: Update Title (Hindi)
        type: string

      - name: message_hi
        label: Update Message (Hindi)
        type: text

  - name: gallery
    label: Media Gallery
    type: collection
    path: content/media
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      fields: [media_type, category, date, status]
      sort: [date, title]
      order: desc
    fields:
      - name: title
        label: Media Title (Internal)
        type: string
        required: true

      - name: media_type
        label: Media Type
        type: select
        required: true
        options:
          values:
            - Image
            - Video URL

      - name: image
        label: Photo
        type: image
        options:
          media: store_media
          path: gallery

      - name: video_url
        label: Video URL (YouTube or other hosted video)
        type: string

      - name: caption
        label: Caption (Optional)
        type: text

      - name: caption_hi
        label: Caption (Hindi)
        type: text

      - name: category
        label: Category
        type: select
        options:
          values:
            - Store
            - Products
            - Hardware
            - Sanitaryware
            - Plumbing
            - Other

      - name: image_alt
        label: Image Alt Text
        type: string

      - name: date
        label: Publication Date
        type: date
        required: true

      - name: status
        label: Publication Status
        type: select
        required: true
        options:
          values:
            - Draft
            - Published


  - name: settings
    label: Store Contact Details
    type: file
    path: content/settings.json
    format: json
    fields:
      - name: phone
        label: Phone Number
        type: string
      - name: address
        label: Store Address
        type: text
      - name: hours
        label: Opening Hours
        type: string
        
